<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontaktform </title>
  <link rel="icon" type="image/x-icon" href="media/favicon.ico">
  <link rel="stylesheet" href="/sass/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Laila:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
  // Laadib headeri sisu
  fetch('header.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('header-placeholder').innerHTML = data;
      
      // Burgermenüü funktsionaalsus pärast headeri laadimist
      const burgerMenu = document.querySelector('.burger-menu');
      const closeMenu = document.querySelector('.close-menu');
      const headerMobile = document.querySelector('.header-mobile');
      const nav = document.querySelector('.nav');
      
      // Avab menüü
      burgerMenu.addEventListener('click', function() {
        headerMobile.classList.add('active');
        nav.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
      
      // Sulgeb menüü
      closeMenu.addEventListener('click', function() {
        headerMobile.classList.remove('active');
        nav.classList.remove('active');
        document.body.style.overflow = '';
      });
      
      // Sulgeb menüü kui linki klikitakse
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
          headerMobile.classList.remove('active');
          nav.classList.remove('active');
          document.body.style.overflow = '';
        });
      });
    });
</script>
</head>

<body>
  <div id="header-placeholder"></div>

    <div class="container">
      <form action="https://api.web3forms.com/submit" method="POST" class="contact-left"> <!--Lingib formidega, et kui kasutaja saadab formi siis tuleb teavitus meile meilile-->
        <div class="contact-left-title"><!--Kontakt form ja vasak poolt lehekülge-->
          <h2>Kirjuta meile!</h2>
          <hr>
        </div>
        <input type="hidden" name="access_key" value="e381d274-f740-4097-8df2-2ce0d3d81630"> <!--Access key, see mis lingib formiga-->
        <input type="text" name="name" placeholder="Sinu nimi" class="contact-inputs" required><!--Sisesta nimi-->
        <input type="email" name="email" placeholder="Sinu email" class="contact-inputs" required><!--Sisesta email-->
        <textarea name="message" placeholder="Sõnum" class="contact-inputs" required></textarea><!--Sisesta sõnum-->
          <button type="submit">Saada</button> <!--Saada nupp-->
      </form>

      <div class="contact-right">
        <img src="media/Vector.svg" alt="Kass ja Koer"> <!--Pilt kassist ja koerast-->
      </div>
    </div>
</body>
</html>
