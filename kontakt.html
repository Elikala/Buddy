<!DOCTYPE html>
<html lang="et">
<head>
  <!-- Dokumendi metaandmed -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontaktvorm</title>
  
  <!-- Lehe ikoon -->
  <link rel="icon" type="image/x-icon" href="media/favicon.ico">
  
  <!-- Stiililehed -->
  <link rel="stylesheet" href="/sass/style.css"/>
  
  <!-- Google'i fondid -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Laila:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Päise laadimise skript -->
  <script>
  // Laadib päise sisu
  fetch('header.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('header-placeholder').innerHTML = data;
      
      // Burger-menüü funktsionaalsus pärast päise laadimist
      const burgerMenu = document.querySelector('.burger-menu');
      const closeMenu = document.querySelector('.close-menu');
      const headerMobile = document.querySelector('.header-mobile');
      const nav = document.querySelector('.nav');
      
      // Avab menüü
      burgerMenu.addEventListener('click', function() {
        headerMobile.classList.add('active');
        nav.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
      
      // Sulgeb menüü
      closeMenu.addEventListener('click', function() {
        headerMobile.classList.remove('active');
        nav.classList.remove('active');
        document.body.style.overflow = '';
      });
      
      // Sulgeb menüü lingi klikkimisel
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
          headerMobile.classList.remove('active');
          nav.classList.remove('active');
          document.body.style.overflow = '';
        });
      });
    });
  </script>
</head>

<body>
  <!-- Päise sektsioon -->
  <div id="header-placeholder"></div>

  <!-- Peamine sisu -->
  <main class="container">
    <!-- Kontaktvormi sektsioon -->
    <section class="contact-left">
      <form action="https://api.web3forms.com/submit" method="POST" aria-label="Kontaktvorm">
        <div class="contact-left-title">
          <h2>Kirjuta meile!</h2>
          <hr>
        </div>
        
        <!-- Varjatud vormi väljad -->
        <input type="hidden" name="access_key" value="e381d274-f740-4097-8df2-2ce0d3d81630">
        
        <!-- Vormi sisendväljad -->
        <div class="form-group">
          <label for="name" class="sr-only">Sinu nimi</label>
          <input type="text" id="name" name="name" placeholder="Sinu nimi" class="contact-inputs" required>
        </div>
        
        <div class="form-group">
          <label for="email" class="sr-only">Sinu e-post</label>
          <input type="email" id="email" name="email" placeholder="Sinu e-post" class="contact-inputs" required>
        </div>
        
        <div class="form-group">
          <label for="message" class="sr-only">Sõnum</label>
          <textarea id="message" name="message" placeholder="Sõnum" class="contact-inputs" required></textarea>
        </div>
        
        <!-- Saada nupp -->
        <button type="submit">Saada</button>
      </form>
    </section>

    <!-- Kontaktpildi sektsioon -->
    <aside class="contact-right">
      <img src="media/Vector.svg" alt="Kass ja koer" aria-label="Kontaktvormi illustratsioon">
    </aside>
  </main>
</body>
</html>
