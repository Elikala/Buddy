<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontaktform </title>
  <link rel="icon" type="image/x-icon" href="media/favicon.ico">
  <link rel="stylesheet" href="/sass/style.css"/>
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="/media/BuddyLogo.png" alt="Buddy Logo" height="50px">
    </div>
    <nav class="nav">
      <ul class="nav-links">
        <a href="/">Avaleht</a>
        <a href="play.html">Alusta mängu</a>
        <a href="kontakt.html">Kontakt</a>
        <a href="#">KKK/Abi</a>
      </ul>
    </nav>
    <div class="profile">
      <img src="/media/Profile.png" alt="Profiili ikoon" height="50px">
    </div>
  </header>
    <div class="container">
      <form action="https://api.web3forms.com/submit" method="POST" class="contact-left"> <!--Lingib formidega, et kui kasutaja saadab formi siis tuleb teavitus meile meilile-->
        <div class="contact-left-title"><!--Kontakt form ja vasak poolt lehekülge-->
          <h2>Kirjuta meile!</h2>
          <hr>
        </div>
        <input type="hidden" name="access_key" value="e381d274-f740-4097-8df2-2ce0d3d81630"> <!--Access key, see mis lingib formiga-->
        <input type="text" name="name" placeholder="Sinu nimi" class="contact-inputs" required><!--Sisesta nimi-->
        <input type="email" name="email" placeholder="Sinu email" class="contact-inputs" required><!--Sisesta email-->
        <textarea name="message" placeholder="Sõnum" class="contact-inputs" required></textarea><!--Sisesta sõnum-->
          <button type="submit">Saada</button> <!--Saada nupp-->
      </form>

      <div class="contact-right">
        <img src="media/Vector.png" alt="Kass ja Koer"> <!--Pilt kassist ja koerast-->
      </div>
    </div>
</body>
</html>
